# Deploys the site to GitHub Pages from main.
#
# The classic push-triggered Pages builder stopped producing builds for this repository on
# 2026-08-26 (pushes and manual build requests alike vanished without a build entry), so the
# site is deployed through Actions instead. Files are published exactly as checked out:
# .gitattributes keeps the signed documents byte-exact, so the signatures stay valid.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Drop what the site must not serve
        run: rm -rf .git .github
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
